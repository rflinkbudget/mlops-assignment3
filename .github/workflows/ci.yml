name: CI Pipeline

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install scikit-learn joblib

    - name: Run training
      run: python dev/train.py

    - name: Build Docker image
      run: docker build -t mlops-model:latest .

    - name: Run prediction
      run: docker run --rm mlops-model:latest

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push to DockerHub
      run: |
        docker tag mlops-model:latest your_dockerhub_username/mlops-model:latest
        docker push your_dockerhub_username/mlops-model:latest
